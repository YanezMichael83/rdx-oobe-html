  fit();
  link.clear();   // codes from an earlier run are stale; a phone that is still showing its code sends it again
  link.send('hello');
  if (q.get('screen') && JUMP[q.get('screen')]) jump(q.get('screen')); else go('lang', { push: false, animate: false });
  fit();

  window.__rdx = { get S() { return S; }, go, jump, ACT, restart, setTheme, setLang, openMobile, link, DEVICE_ID, render };
})(window.RDX);

</script>
<script>
/* RDX OOBE prototype: the mobile app that the setup QR code opens.
   It is this same page opened with ?view=mobile (the RDX prototype opens it in a new window beside the RDX screen).
   Steps: confirm the store, confirm the store Wi-Fi and password, scan the UPC barcode on the box (simulated, no camera),
   see the exact PC and SKU from the retailer's site, then show a new QR code that carries everything to the RDX device. */
(function (R) {
  const q = new URLSearchParams(location.search);
  if (q.get('view') !== 'mobile') return;

  const I = R.I, A = R.art, D = R.data, i18n = R.i18n, { t, T } = i18n, link = R.qr.link;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const DEVICE = /^[\w-]{1,16}$/.test(q.get('device') || '') ? q.get('device') : R.qr.newDeviceId();
  const SPEED = +q.get('speed') || 1;
  const real = q.get('real') === '1' || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600);

  const LOC = { region: 'North America', country: 'United States', state: 'Washington', city: 'Seattle' };
  const RETAILER = 'Best Buy', SITE = D.RETAILER_SITE[RETAILER];
  const STEPS = ['store', 'wifi', 'scan', 'product', 'code'];
  const STEP_NAME = { store: 'Store', wifi: 'Wi-Fi', scan: 'Scan barcode', product: 'Product found', code: 'Setup code' };
  const PROG = { store: 0, wifi: 1, scan: 2, product: 2, code: 3 };
  const PROG_LABELS = [T('Store'), T('Wi-Fi'), T('Barcode'), T('Code')];
  const BACK = { wifi: 'store', scan: 'wifi', product: 'scan', code: 'product' };
  const BOX_NAME = { gaming: 'Gaming', everyday: 'Everyday', creator: 'Creator' };
  const abbr = (l) => ({ en: 'EN', es: 'ES', fr: 'FR', zh: '中文' }[l.base] || l.tag);

  /* ---------- state ---------- */
  const fresh = (keep) => Object.assign({
    step: 'store', find: 'finding', store: D.defStore(RETAILER, LOC), sheet: null,
    wifi: { ssid: D.networks[0].name, pw: D.wifiPassword, show: false },
    scan: { state: 'idle', box: 0 }, product: null, code: null,
  }, keep);
  let S = fresh({ theme: q.get('theme') === 'dark' ? 'dark' : 'light', lang: i18n.LANGS[0].tag });

  let timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms / SPEED); timers.push(id); return id; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  let toastT;
  const toast = (msg) => { const el = $('#ptoast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3400); };

  const stores = () => D.storesFor(RETAILER, LOC);
  const storeObj = () => stores().find((s) => s.id === S.store) || stores()[0];
  const storeLine = (s) => `${RETAILER} · ${t('Store {id}', { id: s.id })}`;
  const storeLineHtml = (s) => `${esc(RETAILER)} · <span class="nw">${esc(t('Store {id}', { id: s.id }))}</span>`;
  const productObj = () => S.product || D.products[S.scan.box];
  const details = () => {
    const p = productObj(), rac = D.racsFor(RETAILER, LOC.country).find((r) => r.key === p.key);
    return { device: DEVICE, ssid: S.wifi.ssid, pw: S.wifi.pw, sec: 'WPA2', country: LOC.country, state: LOC.state, city: LOC.city, retailer: RETAILER, store: S.store, rac: rac.code, sku: p.sku, upc: p.upc, lang: i18n.tag };
  };

  /* ---------- building blocks ---------- */
  const btn = (label, act, o = {}) => `<button class="mbtn ${o.cls || ''}" data-act="${act}"${o.data ? ' ' + o.data : ''}${o.disabled ? ' disabled' : ''}${o.primary ? ' data-primary' : ''}>${label}</button>`;
  const signal = `<svg viewBox="0 0 18 12" width="17" height="12" aria-hidden="true"><path d="M1 10h2.4v1H1zM5.4 7.5h2.4V11H5.4zM9.8 4.8h2.4V11H9.8zM14.2 2h2.4v9h-2.4z" fill="currentColor"/></svg>`;
  const statusBar = () => `<div class="mstatus"><span>${i18n.time()}</span><span class="mi">${signal}${I.wifi(15)}${I.battery(19)}</span></div>`;
  function header() {
    const left = S.step === 'store' ? `<span class="mlogo">${I.rdxMark(32)}</span>` : `<button class="mback" data-act="back" aria-label="${esc(t('Back'))}">${I.back(22)}</button>`;
    return `<header class="mhead">${left}<div class="mtitle"><b>${t('RDX Setup')}</b><small>${t('Device {id}', { id: esc(DEVICE) })}</small></div><button class="mlang" data-act="lang-sheet" aria-label="${esc(i18n.lang.label)}">${I.globe(16)}<span>${abbr(i18n.lang)}</span></button></header>`;
  }
  const progress = () => `<div class="mprog" aria-hidden="true">${PROG_LABELS.map((l, i) => `<div class="ps ${i < PROG[S.step] ? 'done' : i === PROG[S.step] ? 'cur' : ''}"><i></i><span>${t(l)}</span></div>`).join('')}</div>`;
  const card = (icon, title, lines, badge) => `<div class="mcard"><div class="mico">${icon}</div><div class="mt"><b>${title}</b>${lines.map((l, i) => `<span class="${i ? 'dim' : ''}">${l}</span>`).join('')}</div>${badge || ''}</div>`;
  const okBadge = (label) => `<span class="mbadge ok">${I.check(12)}${label}</span>`;

  /* The box on the shelf: a product box with its UPC label (simulated camera view) */
  function boxSvg(p) {
    const digits = p.upc.split('').map(Number);
    let x = 0, bars = '';
    digits.forEach((d, i) => { const w = 1.2 + (d % 4) * 0.7; if (i % 2 === 0 || d > 4) bars += `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="30"/>`; x += w + 1.3; });
    const scale = 118 / x;
    const grad = { gaming: ['#1b8cf6', '#5b3dd6'], everyday: ['#22b8a0', '#1b8cf6'], creator: ['#ff8a4c', '#c43dd6'] }[p.key];
    return `<svg viewBox="0 0 300 200" width="270" height="180" aria-hidden="true"><defs><linearGradient id="bx${p.key}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${grad[0]}"/><stop offset="1" stop-color="${grad[1]}"/></linearGradient></defs>
      <rect x="6" y="6" width="288" height="188" rx="16" fill="url(#bx${p.key})"/><rect x="6" y="6" width="288" height="42" rx="16" fill="#fff" opacity=".14"/>
      <rect x="30" y="64" width="86" height="58" rx="7" fill="none" stroke="#fff" stroke-width="5"/><path d="M18 132h110" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(150 96)"><rect width="132" height="84" rx="8" fill="#fff"/><g transform="translate(7 8) scale(${scale.toFixed(3)} 1)" fill="#1b2231">${bars}</g>
      <text x="66" y="56" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33405c" letter-spacing=".6" font-family="Consolas,'Segoe UI',monospace">${D.upcText(p.upc)}</text>
      <text x="66" y="73" text-anchor="middle" font-size="9" font-weight="700" fill="#6b7792" letter-spacing="2" font-family="'Segoe UI',sans-serif">UPC</text></g></svg>`;
  }

  /* ---------- steps ---------- */
  function vStore() {
    const s = storeObj(), finding = S.find === 'finding';
    const body = finding
      ? `<div class="mcard busy"><div class="mspin"></div><div class="mt"><b>${t('Finding your store…')}</b><span class="dim">${t('This usually takes a few seconds.')}</span></div></div>`
      : `${card(I.store(24), storeLineHtml(s), [esc(D.storePlace(s, LOC)), t('{dist} away', { dist: D.storeDist(s) })], okBadge(t('Detected')))}
         <p class="mnote">${I.pin(16)}<span>${t('Detected from your phone’s location.')}</span></p>`;
    return {
      body: `<div class="mart">${A.pin()}</div><h2>${t('Set up your RDX device')}</h2><p class="msub">${t('We’ll check your store and Wi-Fi, then read the barcode on the box.')}</p>${body}`,
      foot: finding ? btn(t('Next'), 'next', { primary: 1, disabled: 1 }) : btn(t('Next'), 'next', { primary: 1 }) + btn(t('Change store'), 'store-change', { cls: 'ghost' }),
    };
  }
  function vWifi() {
    const w = S.wifi;
    return {
      body: `<div class="mart small">${A.wifi()}</div><h2>${t('Check the store Wi-Fi')}</h2><p class="msub">${t('Your phone should be on the same network this device will use.')}</p>
        ${card(I.wifi(24), esc(w.ssid), [t('Secure')], okBadge(t('Connected')))}
        <label class="mfield"><span class="lab">${t('Wi-Fi password')}</span><span class="box"><input data-input="pw" type="${w.show ? 'text' : 'password'}" value="${esc(w.pw)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t('Enter the Wi-Fi password'))}"><button class="eye" data-act="pw-show" aria-label="${esc(w.show ? t('Hide') : t('Show'))}">${w.show ? I.eyeOff(20) : I.eye(20)}</button></span></label>
        <p class="mnote">${I.lock(16)}<span>${t('RDX will use this network and password to connect the device.')}</span></p>`,
      foot: btn(t('Next'), 'next', { primary: 1, disabled: !w.pw.trim() }),
    };
  }
  function vScan() {
    const sc = S.scan, p = D.products[sc.box];
    const found = sc.state === 'found', lookup = sc.state === 'lookup';
    const res = found ? `<div class="vfres ok">${I.check(22)}<div><b>${t('Barcode found')}</b><span>${t('UPC {code}', { code: D.upcText(p.upc) })}</span></div></div>`
      : lookup ? `<div class="vfres"><i class="mini-spin"></i><div><b>${t('Looking up the PC on {site}…', { site: SITE })}</b></div></div>` : '';
    const vf = `<div class="mvf ${sc.state}"><div class="feed"></div><div class="mbox">${boxSvg(p)}</div>${sc.state === 'scanning' ? '<div class="line"></div>' : ''}<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>${res}</div>`;
    const chips = `<div class="mchips"><span class="plabel">Prototype: the camera is simulated. Choose a box to scan.</span><span class="row">${D.products.map((x, i) => `<button class="mchip ${i === sc.box ? 'on' : ''}" data-act="box" data-i="${i}"${sc.state !== 'idle' ? ' disabled' : ''}>${BOX_NAME[x.key]}</button>`).join('')}</span></div>`;
    return {
      body: `<h2>${t('Scan the barcode on the box')}</h2><p class="msub">${t('Line up the barcode on the PC’s box inside the frame.')}</p>${vf}${chips}`,
      foot: btn(`${I.scan(20)}${t('Scan barcode')}`, 'scan-go', { primary: 1, disabled: sc.state !== 'idle' }),
    };
  }
  function vProduct() {
    const p = productObj();
    return {
      body: `<h2>${t('We found your PC')}</h2><p class="msub">${t('From {site}', { site: SITE })}</p>
        <div class="mcard prod"><div class="pimg">${p.key === 'gaming' ? A.gaming() : A.device()}</div><div class="mt"><b>${esc(p.name)}</b><span>${t('SKU {id}', { id: p.sku })}</span><span class="dim">${t('UPC {code}', { code: D.upcText(p.upc) })}</span></div></div>
        <p class="mnote ok">${I.check(16)}<span>${t('Matched to the exact PC on {site}.', { site: SITE })}</span></p>`,
      foot: btn(t('Next'), 'next', { primary: 1 }) + btn(t('Scan again'), 'rescan', { cls: 'ghost' }),
    };
  }
  function vCode() {
    const d = S.code || details(), s = storeObj();
    const rows = [[t('Retailer and store'), storeLine(s)], [t('Wi-Fi network'), d.ssid], [t('SKU ID'), d.sku]];
    return {
      body: `<h2>${t('Your setup code is ready')}</h2><p class="msub">${t('On your RDX device, select “{button}”, then show this code to its camera.', { button: t('I’m ready, I have a QR code') })}</p>
        <div class="mqr"><div class="qrbox">${R.qr.svg(R.qr.encode(d), { size: 224, margin: 1, label: t('QR code') })}</div></div>
        <div class="msum">${rows.map(([k, v]) => `<div><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div>
        <p class="mnote">${I.lock(16)}<span>${t('This code contains your Wi-Fi password. Keep it private.')}</span></p>
        <p class="mproto">Prototype: the RDX window reads this code when you select its “I’m ready” button.</p>`,
      foot: btn(t('Start over'), 'restart', { cls: 'ghost' }),
    };
  }
  const VIEW = { store: vStore, wifi: vWifi, scan: vScan, product: vProduct, code: vCode };

  function sheet() {
    if (S.sheet === 'store') {
      return `<div class="msheet-wrap" data-act="sheet-close"><div class="msheet" data-act="noop"><div class="grab"></div><h3>${t('Choose your store')}</h3>
        <div class="mlist">${stores().map((s) => `<button class="mrow ${s.id === S.store ? 'sel' : ''}" data-act="store-pick" data-v="${s.id}"><span class="r"></span><span class="t"><b>${storeLineHtml(s)}</b><small>${esc(D.storePlace(s, LOC))} · ${t('{dist} away', { dist: D.storeDist(s) })}</small></span></button>`).join('')}</div>
        ${btn(t('Done'), 'sheet-close', { primary: 1 })}</div></div>`;
    }
    if (S.sheet === 'lang') {
      return `<div class="msheet-wrap" data-act="sheet-close"><div class="msheet" data-act="noop"><div class="grab"></div><h3>${t('Language')}</h3>
        <div class="mlist">${i18n.TOP.map((l) => `<button class="mrow ${l.base === i18n.base ? 'sel' : ''}" data-act="lang-pick" data-v="${l.tag}" lang="${l.tag}"><span class="r"></span><span class="t"><b>${esc(l.label)}</b></span></button>`).join('')}</div>
        ${btn(t('Done'), 'sheet-close', { primary: 1 })}</div></div>`;
    }
    return '';
  }

  /* ---------- rendering / navigation ---------- */
  function render() {
    const v = VIEW[S.step](), screen = $('#mscreen');
    const scroller = $('.mbody', screen), top = scroller ? scroller.scrollTop : 0;
    screen.innerHTML = `<div class="m ${S.step}" lang="${i18n.tag}">${statusBar()}${header()}${progress()}<main class="mbody">${v.body}</main><footer class="mfoot">${v.foot}</footer>${sheet()}</div>`;
    const again = $('.mbody', screen); if (again && top) again.scrollTop = top;
    syncChrome();
  }
  function go(step) {
    clearTimers();
    S.step = step; S.sheet = null;
    if (step === 'store' && S.find === 'finding') later(() => { if (S.step === 'store') { S.find = 'found'; render(); } }, 1300);
    if (step === 'scan') S.scan = { state: 'idle', box: S.scan.box };
    if (step === 'code') { S.code = details(); link.publish(S.code); } else link.clear();   // the device must not read a code the phone is no longer showing
    render();
  }
  function restart() { clearTimers(); S = fresh({ theme: S.theme, lang: S.lang }); link.clear(); go('store'); }
  function jumpTo(step) {
    clearTimers();
    if (step !== 'store') S.find = 'found';
    if (step === 'product' || step === 'code') S.product = D.products[S.scan.box];
    go(step);
  }
  function setLang(tag) { const l = i18n.byTag(tag); if (!l || !l.base) return; S.lang = tag; i18n.set(tag); if (S.step === 'code') { S.code = details(); link.publish(S.code); } render(); }
  function setTheme(mode) { S.theme = mode === 'dark' ? 'dark' : 'light'; document.body.classList.toggle('theme-dark', S.theme === 'dark'); syncChrome(); }

  function scanGo() {
    if (S.scan.state !== 'idle') return;
    S.scan.state = 'scanning'; render();
    later(() => { S.scan.state = 'found'; render(); later(() => { S.scan.state = 'lookup'; render(); later(() => { S.product = D.products[S.scan.box]; go('product'); }, 1300); }, 1000); }, 1500);
  }

  const ACT = {
    noop() {},
    back() { if (BACK[S.step]) go(BACK[S.step]); },
    next() { const n = { store: 'wifi', wifi: 'scan', product: 'code' }[S.step]; if (n) go(n); },
    'store-change'() { S.sheet = 'store'; render(); },
    'store-pick'(el) { S.store = el.dataset.v; render(); },
    'sheet-close'() { S.sheet = null; render(); },
    'lang-sheet'() { S.sheet = 'lang'; render(); },
    'lang-pick'(el) { S.sheet = null; setLang(el.dataset.v); },
    'pw-show'() { S.wifi.show = !S.wifi.show; render(); const i = $('input[data-input="pw"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } },
    box(el) { if (S.scan.state === 'idle') { S.scan.box = +el.dataset.i; render(); } },
    'scan-go'() { scanGo(); },
    rescan() { go('scan'); },
    restart() { restart(); },
  };
  document.addEventListener('click', (e) => {
    const tgt = e.target.closest('[data-act]');
    if (!tgt || !$('#mscreen').contains(tgt) || tgt.disabled) return;
    if (ACT[tgt.dataset.act]) ACT[tgt.dataset.act](tgt, e);
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.input === 'pw') {
      S.wifi.pw = e.target.value;
      const next = $('[data-act="next"]', $('#mscreen')); if (next) next.disabled = !S.wifi.pw.trim();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('.mtb')) return;
    if (e.key === 'Enter' && !(e.target.tagName === 'BUTTON')) { const p = $('[data-primary]:not([disabled])', $('#mscreen')); if (p) { p.click(); e.preventDefault(); } }
    else if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
  });

  /* ---------- chrome: toolbar, fit, link to the RDX window ---------- */
  function buildToolbar() {
    $('#mtb').innerHTML = `
      <div class="brand">${I.rdxMark(22)}<b>RDX mobile</b><span>prototype</span></div>
      <select id="mjump" title="Jump to a step">${STEPS.map((s, i) => `<option value="${s}">${i + 1} · ${STEP_NAME[s]}</option>`).join('')}</select>
      <span class="seg2" id="mlangSeg">${i18n.TOP.map((l) => `<button data-l="${l.tag}" lang="${l.tag}">${abbr(l)}</button>`).join('')}</span>
      <span class="seg2" id="mthemeSeg"><button data-t="light">Light</button><button data-t="dark">Dark</button></span>
      <button class="chip" id="mrestart" title="Start over">↺</button>
      <button class="chip" id="mrdx" title="Bring the RDX window to the front">RDX window</button>`;
    $('#mjump').addEventListener('change', (e) => jumpTo(e.target.value));
    $('#mlangSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setLang(b.dataset.l); });
    $('#mthemeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.t); });
    $('#mrestart').addEventListener('click', restart);
    $('#mrdx').addEventListener('click', () => { try { if (window.opener && !window.opener.closed) window.opener.focus(); else toast('The RDX window was opened from somewhere else. Switch to it from your taskbar.'); } catch (err) { /* cross-window focus refused */ } });
  }
  function syncChrome() {
    const j = $('#mjump'); if (!j) return;
    j.value = S.step;
    $('#mlangSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', i18n.byTag(b.dataset.l).base === i18n.base));
    $('#mthemeSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === S.theme));
    document.title = `RDX mobile setup (prototype) · ${STEPS.indexOf(S.step) + 1} ${STEP_NAME[S.step]}`;
  }
  function fit() {
    const st = $('#mstage'); if (!st || real || !st.clientWidth) return;
    const k = Math.min(st.clientWidth / 440, st.clientHeight / 892, 1.3);
    $('#mscale').style.transform = `translate(-50%, -50%) scale(${k})`;
  }

  /* ---------- boot ---------- */
  document.body.className = 'mobileview' + (real ? ' real' : '') + (S.theme === 'dark' ? ' theme-dark' : '');
  document.body.innerHTML = `<div class="mtb" id="mtb"></div><div class="mstage" id="mstage"><div id="mscale"><div class="phone"><div class="island"></div><div class="mscreen" id="mscreen"></div></div></div></div><div class="ptoast" id="ptoast"></div>`;
  const startLang = i18n.byTag(q.get('lang'));
  if (startLang && startLang.base) { S.lang = startLang.tag; i18n.set(startLang.tag); }
  buildToolbar();
  new ResizeObserver(fit).observe($('#mstage'));
  link.clear();
  link.beat();
  setInterval(link.beat, 2000);
  addEventListener('pagehide', link.gone);
  link.onMessage((type, value) => {
    if (type === 'reset') { restart(); if (value) setLang(value); }
    else if (type === 'lang') setLang(value);
    else if (type === 'theme') setTheme(value);
    else if (type === 'hello' && S.step === 'code' && S.code) link.publish(S.code);
  });
  fit();
  if (STEPS.includes(q.get('step'))) jumpTo(q.get('step')); else go('store');
  fit();

  window.__mobile = { get S() { return S; }, go, jumpTo, ACT, restart, setLang, setTheme, details, render, DEVICE };
})(window.RDX);

</script>
</body>
</html>
