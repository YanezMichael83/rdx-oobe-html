<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDX 5-tap OOBE — Prototype</title>
<style>
/* =====================================================================
   RDX 5-Tap OOBE — design review styles
   1) Gallery chrome   2) OOBE screen system   3) Per-screen pieces
   ===================================================================== */

/* ---------- 1) Gallery chrome ---------- */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #11151c; color: #e8edf6; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
a { color: inherit; }

.topbar { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 22px; background: rgba(17,21,28,.94); backdrop-filter: blur(8px); border-bottom: 1px solid #243044; }
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; white-space: nowrap; }
.topbar .meta { color: #8a9bb6; font-size: 12.5px; }
.topbar .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: #1b2331; border: 1px solid #2b374a; color: #c9d6ec; font-size: 12.5px; text-decoration: none; cursor: pointer; }
.chip:hover { background: #26334a; }
.chip.on { background: #1d4f8f; border-color: #3b7bd0; color: #fff; }
.seg2 { display: inline-flex; border: 1px solid #2b374a; border-radius: 999px; overflow: hidden; }
.seg2 button { all: unset; cursor: pointer; padding: 5px 12px; font-size: 12.5px; color: #c9d6ec; background: #1b2331; }
.seg2 button.on { background: #1d4f8f; color: #fff; }

.wrap { max-width: 1560px; margin: 0 auto; padding: 8px 22px 80px; }
.intro { margin: 22px 0 6px; max-width: 980px; }
.intro h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
.intro p { margin: 0; color: #97a8c4; font-size: 14.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 0; color: #97a8c4; font-size: 13px; }
.legend b { color: #e8edf6; font-weight: 600; }

.flowbox { margin: 20px 0 8px; background: #0e131a; border: 1px solid #243044; border-radius: 12px; padding: 14px; overflow: auto; }
.flowbox svg { display: block; width: 100%; min-width: 900px; height: auto; }
.flowbox a { cursor: pointer; }
.flowbox a:hover rect { stroke: #5aa2ff; }

.flowlist { display: none; margin: 18px 0 6px; background: #0e131a; border: 1px solid #243044; border-radius: 12px; padding: 14px 16px; }
.flowlist .fl-sec { margin: 0 0 14px; }
.flowlist .fl-sec:last-child { margin-bottom: 0; }
.flowlist h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #cfe0ff; }
.flowlist h4 span { display: block; margin-top: 2px; font-weight: 400; color: #8a9bb6; font-size: 12.5px; }
.flowlist .fl-chain, .flowlist .fl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: #aab9d2; }
.flowlist .fl-row { margin: 0 0 8px; }
.flowlist i { font-style: normal; color: #6f819f; }
.flowlist a.fl { text-decoration: none; padding: 4px 9px; border-radius: 8px; background: #17202e; border: 1.5px solid #3b8bff; color: #fff; font-size: 12.5px; }
.flowlist a.fl b { margin-right: 4px; }
.flowlist a.b0 { border-color: #7f9cc9; } .flowlist a.b0 b { color: #9db6dd; }
.flowlist a.b1 b { color: #3b8bff; }
.flowlist a.b2 { border-color: #a47bff; } .flowlist a.b2 b { color: #a47bff; }
.flowlist a.b3 { border-color: #e0a43a; } .flowlist a.b3 b { color: #e0a43a; }
.flowlist a.b4 { border-color: #ff8a4c; } .flowlist a.b4 b { color: #ff8a4c; }
.flowlist a.b5 { border-color: #37c978; } .flowlist a.b5 b { color: #37c978; }
.flowlist .y { color: #6fe39a; font-weight: 600; } .flowlist .n { color: #ff9d86; font-weight: 600; }
.flowlist .fl-note { margin: 4px 0 0; color: #e0a43a; font-size: 12.5px; }
@media (max-width: 900px) {
  .flowbox { display: none; }
  .flowlist { display: block; }
  .topbar { position: static; padding: 10px 14px; }
  .wrap { padding: 4px 14px 60px; }
  .intro h1 { font-size: 22px; }
}

.phase { margin: 38px 0 10px; scroll-margin-top: 70px; }
.phase > h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.phase > h2 .ph { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #1d4f8f; font-size: 13px; }
.phase > p { margin: 0 0 16px; color: #93a3bd; font-size: 14px; max-width: 920px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 30px 26px; }
figure.fig { margin: 0; scroll-margin-top: 72px; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,.5); outline: 1px solid #2a3547; cursor: zoom-in; background: #dfe8f8; }
.frame:hover { outline-color: #4a86d8; }
.frame .scr { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
figcaption { margin-top: 11px; }
figcaption .t { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15.5px; }
figcaption .n { display: inline-grid; place-items: center; min-width: 38px; height: 22px; padding: 0 8px; border-radius: 6px; background: #1d4f8f; color: #fff; font-size: 12px; font-weight: 700; }
figcaption .n.alt { background: #6b3fb8; }
figcaption ul { margin: 6px 0 0; padding-left: 18px; color: #a9b8d0; font-size: 13.5px; line-height: 1.5; }
figcaption li { margin: 2px 0; }
.route { display: flex; flex-wrap: wrap; gap: 3px 16px; margin: 6px 0 0; font-size: 13px; color: #8fa2c0; }
.route b { font-weight: 700; color: #c9d6ec; }
.route b.yes { color: #6fe39a; } .route b.no { color: #ff9d86; }
.route a { color: #8fc0ff; text-decoration: none; }
.route a:hover { text-decoration: underline; }

.lb { position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,8,14,.93); backdrop-filter: blur(6px); }
.lb.on { display: flex; }
.lb .stage { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.lb .stage .scr { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.lb .cap { margin-top: 14px; text-align: center; color: #c8d4ea; font-size: 14px; max-width: 980px; }
.lb .cap b { color: #fff; font-size: 16px; }
.lb .btn-r { z-index: 3; width: 44px; height: 44px; border-radius: 50%; background: #1d2635; border: 1px solid #33425c; color: #fff; display: grid; place-items: center; cursor: pointer; }
.lb .x { position: absolute; right: 16px; top: 14px; }
.lb .navrow { display: flex; align-items: center; gap: 18px; margin-top: 14px; color: #9fb0cc; font-size: 13px; }

body.shot { margin: 0; background: #fff; overflow: hidden; }
body.shot .scr { transform-origin: 0 0; }
.sheet { display: grid; grid-template-columns: repeat(4, 640px); gap: 24px 22px; padding: 26px; width: max-content; background: #11151c; }
.sheet .fr { width: 640px; height: 360px; position: relative; overflow: hidden; border-radius: 6px; outline: 1px solid #2a3547; }
.sheet .fr .scr { transform: scale(.5); transform-origin: 0 0; }
.sheet .lab { margin-top: 7px; color: #d4def0; font-size: 13.5px; font-weight: 600; }
.sheet .lab span { color: #7fb0ff; margin-right: 6px; }

/* ---------- 2) OOBE screen system (1280 x 720 logical) ---------- */
.scr {
  --accent: #0067c0; --accent-2: #005aa6; --soft: #e3eaf5;
  --txt: #1b1f27; --txt2: #59616f; --line: #d5dce8;
  --field: #ffffff; --field-line: #c2cbdb; --field-base: #707c8f;
  --panel: rgba(255,255,255,.72); --chip: rgba(255,255,255,.82);
  --btn2: #ffffff; --btn2-line: #c5cddb; --btn2-txt: #1b1f27;
  --ok: #0f7b0f; --ok-bg: #e3f3e3; --pilltxt: #0b5cad;
  --menu: #ffffff; --menu-on: #eaf2fb; --menu-line: #cfd7e4;
  position: relative; width: 1280px; height: 720px; overflow: hidden; color: var(--txt);
  font: 16px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(720px 420px at 4% 98%, rgba(110,150,245,.55), transparent 70%),
    radial-gradient(680px 420px at 98% 4%, rgba(200,221,252,.9), transparent 70%),
    radial-gradient(620px 360px at 94% 100%, rgba(170,152,235,.5), transparent 70%),
    linear-gradient(135deg, #e7f0fb, #dce7f8 50%, #e5e7f8);
}
.theme-dark .scr {
  --accent: #1a7fe0; --accent-2: #136ac0; --soft: rgba(255,255,255,.13);
  --txt: #ffffff; --txt2: #bcd0ee; --line: rgba(255,255,255,.22);
  --field: rgba(4,34,78,.78); --field-line: #4f86c6; --field-base: #8fb8ee;
  --panel: rgba(255,255,255,.09); --chip: rgba(255,255,255,.11);
  --btn2: rgba(255,255,255,.1); --btn2-line: rgba(255,255,255,.38); --btn2-txt: #ffffff;
  --ok: #34c759; --ok-bg: rgba(52,199,89,.2); --pilltxt: #bcdcff;
  --menu: #0a3a75; --menu-on: #1a6fd0; --menu-line: #4f86c6;
  background: linear-gradient(135deg, #0c53a6 0%, #093f84 52%, #062c63 100%);
}
.scr svg { display: block; }
.scr .card {
  position: absolute; left: 56px; right: 56px; top: 40px; bottom: 64px; border-radius: 10px; overflow: hidden;
  background: linear-gradient(165deg, rgba(255,255,255,.97), rgba(241,246,254,.97) 55%, rgba(232,239,252,.97));
  box-shadow: 0 22px 54px rgba(24,52,124,.2), 0 2px 8px rgba(24,52,124,.12);
}
.theme-dark .scr .card { background: linear-gradient(165deg, rgba(255,255,255,.12), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 22px 54px rgba(0,10,40,.35); }

.scr .back { position: absolute; left: 22px; top: 20px; z-index: 3; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--txt); display: grid; place-items: center; }
.scr .pill { position: absolute; right: 22px; top: 22px; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--pilltxt); }
.scr .pill i { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, #1b8cf6, #5b3dd6); }
.scr .left { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; display: grid; place-items: center; padding-top: 10px; }
.scr .right { position: absolute; left: 54%; right: 5%; top: 84px; bottom: 96px; }
.scr .sys { position: absolute; right: 68px; bottom: 20px; display: flex; gap: 22px; color: var(--txt); opacity: .9; }

.scr h1 { margin: 0 0 18px; font: 400 28px/1.22 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.005em; }
.scr .hint { margin: -6px 0 16px; font-size: 14.5px; color: var(--txt2); }
.scr .kicker { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .03em; color: var(--txt2); }

.scr .btn { min-width: 116px; height: 40px; padding: 0 24px; border-radius: 5px; border: 1px solid var(--btn2-line); background: var(--btn2); color: var(--btn2-txt); font: 600 15px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); white-space: nowrap; }
.scr .btn.primary { background: var(--accent); border-color: var(--accent-2); color: #fff; }
.scr .btn.disabled { background: #e6e9ef; border-color: #d6dae2; color: #9aa2b0; box-shadow: none; }
.theme-dark .scr .btn.disabled { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.5); }
.scr .btn.link { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent); min-width: 0; padding: 0 10px; }
.theme-dark .scr .btn.link { color: #8fc4ff; }
.scr .actions { position: absolute; right: 44px; bottom: 32px; display: flex; gap: 12px; align-items: center; }
.scr .adv { position: absolute; left: 36px; bottom: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--txt); font-size: 13.5px; font-weight: 600; }
.scr .adv svg { color: var(--accent); }
.theme-dark .scr .adv svg { color: #8fc4ff; }

/* stepper */
.scr .stepper { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-start; width: 560px; }
.scr .stepper .st { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; }
.scr .stepper .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #b5c0d3; background: var(--field); display: grid; place-items: center; color: #fff; }
.theme-dark .scr .stepper .dot { border-color: rgba(255,255,255,.4); background: transparent; }
.scr .stepper .done .dot { background: var(--accent); border-color: var(--accent); }
.scr .stepper .cur .dot { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,103,192,.16); }
.scr .stepper .cur .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.scr .stepper .lbl { font-size: 11.5px; color: var(--txt2); white-space: nowrap; }
.scr .stepper .cur .lbl { color: var(--accent); font-weight: 700; }
.theme-dark .scr .stepper .cur .lbl { color: #bcdcff; }
.scr .stepper .seg { flex: 1; height: 2px; margin-top: 9px; background: #cdd5e3; }
.theme-dark .scr .stepper .seg { background: rgba(255,255,255,.25); }
.scr .stepper .seg.on { background: var(--accent); }

/* ---------- 3) Per-screen pieces ---------- */
/* lists (OOBE country/region style) */
.scr .list { display: flex; flex-direction: column; gap: 6px; }
.scr .list.fade { -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }
.scr .item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 7px 16px; border-radius: 6px; color: var(--txt); }
.scr .item .t { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.scr .item b { font-weight: 500; font-size: 17px; }
.scr .item small { font-size: 13px; opacity: .72; margin-top: 1px; }
.scr .item code { font: 500 13px Consolas, "Cascadia Mono", monospace; padding: 3px 8px; border-radius: 5px; background: rgba(0,0,0,.06); }
.scr .item .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(0,103,192,.1); color: var(--pilltxt); }
.scr .item.sel { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(0,103,192,.25); }
.scr .item.sel code, .scr .item.sel .tag { background: rgba(255,255,255,.22); color: #fff; }
.theme-dark .scr .item code { background: rgba(255,255,255,.12); }
.theme-dark .scr .item .tag { background: rgba(255,255,255,.14); color: #d6e8ff; }

/* detected value bar */
.scr .detected { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 8px; background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(0,103,192,.28); }
.scr .detected .ico { flex: none; width: 48px; height: 48px; border-radius: 11px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.scr .detected .v { font-size: 24px; font-weight: 600; line-height: 1.15; }
.scr .detected .s { margin-top: 4px; font-size: 14px; opacity: .92; }
.scr .detected code { font: 600 13.5px Consolas, "Cascadia Mono", monospace; background: rgba(255,255,255,.2); padding: 2px 7px; border-radius: 5px; margin-left: 4px; }
.scr .facts { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.scr .facts li { display: flex; gap: 11px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; color: var(--txt2); }
.scr .facts li svg { flex: none; margin-top: 1px; color: var(--accent); }
.theme-dark .scr .facts li svg { color: #8fc4ff; }
.scr .facts li.ok { color: var(--ok); font-weight: 600; }
.scr .facts li.ok svg { color: var(--ok); }
.scr .facts li a { color: var(--accent); font-weight: 600; }

/* form fields */
.scr .field { position: relative; margin: 0 0 14px; }
.scr .field .lab { margin: 0 0 6px; font-size: 13px; color: var(--txt2); }
.scr .sbox { height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px; border: 1px solid var(--field-line); border-bottom-color: var(--field-base); border-radius: 6px; background: var(--field); font-size: 16px; color: var(--txt); }
.scr .sbox span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scr .sbox.focus { border-color: var(--accent); border-bottom: 2px solid var(--accent); }
.scr .sbox.dis { background: rgba(0,0,0,.04); border-color: #dde3ec; color: #8d96a5; }
.theme-dark .scr .sbox.dis { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); color: rgba(255,255,255,.45); }
.scr .sbox svg { flex: none; opacity: .75; }
.scr .sbox .ph { color: #8a93a3; }
.scr .sbox .caret { display: inline-block; width: 1.5px; height: 20px; background: var(--accent); margin-left: 1px; vertical-align: middle; }
.scr .menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--menu); border: 1px solid var(--menu-line); border-radius: 8px; padding: 4px; box-shadow: 0 16px 36px rgba(20,40,90,.26); }
.scr .menu div { position: relative; height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 5px; font-size: 15px; }
.scr .menu div.on { background: var(--menu-on); font-weight: 600; }
.scr .menu div.on::before { content: ""; position: absolute; left: 2px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
.theme-dark .scr .menu div.on::before { background: #fff; }
.scr .cap { margin-top: 5px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--txt2); }
.scr .cap.ok { color: var(--ok); font-weight: 600; }
.scr .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; margin: 0 0 12px; border: 1px solid var(--field-line); border-bottom-color: var(--field-base); border-radius: 6px; background: var(--field); color: var(--txt2); font-size: 15px; }
.scr .helper { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--txt2); }
.scr .helper b { color: var(--txt); font-weight: 600; }
.scr .more { margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--accent); display: inline-flex; gap: 8px; align-items: center; }
.theme-dark .scr .more { color: #8fc4ff; }

/* network list */
.scr .nets { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.scr .net { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 6px; font-size: 16px; }
.scr .net.sel { flex-direction: column; align-items: stretch; gap: 10px; background: var(--soft); padding: 14px 16px 16px; }
.scr .net .r1 { display: flex; align-items: center; gap: 12px; }
.scr .net .sub { margin: -6px 0 0 32px; font-size: 13px; color: var(--txt2); }
.scr .net .chk { display: flex; align-items: center; gap: 10px; margin-left: 32px; font-size: 14px; }
.scr .cb { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.scr .net .go { align-self: flex-end; }

/* spinner + detecting */
.scr .busy:not(.btn) { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 26px; }
.scr .spin { width: 62px; height: 62px; border-radius: 50%; border: 6px solid #d3dbe8; border-top-color: var(--accent); animation: sp 1s linear infinite; }
.theme-dark .scr .spin { border-color: rgba(255,255,255,.22); border-top-color: #fff; }
.scr .busy .txt { font-size: 22px; }
.scr .busy .sub { margin-top: -8px; font-size: 14px; color: var(--txt2); }
.scr .steps { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.scr .stp { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--txt2); }
.scr .stp .ic { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.scr .stp.done { color: var(--txt); }
.scr .stp.done .ic { background: var(--ok); color: #fff; }
.scr .stp.now { color: var(--txt); font-weight: 600; }
.scr .stp.now .ic { border: 3px solid #cfd8e6; border-top-color: var(--accent); animation: sp 1s linear infinite; }
.scr .stp.wait .ic { border: 2px solid #c3ccd9; }
.theme-dark .scr .stp.wait .ic { border-color: rgba(255,255,255,.35); }
@keyframes sp { to { transform: rotate(360deg); } }
@keyframes steam { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-10px); opacity: .8; } }
.scr .steam { animation: steam 2.6s ease-in-out infinite; }
body.shot .scr .spin, body.shot .scr .stp.now .ic, body.shot .scr .task.now .ic, body.shot .scr .steam, .sheet .scr .spin, .sheet .scr .steam { animation: none; }

/* 5-tap entry overlay */

        if (c < 128) {

<script>
/* RDX OOBE: localization core.
   The English text is the key: t('Next'). Translations are registered by lang-<code>.js files.
   Language variants (en-GB, fr-CA, ...) use their base language's strings and may override single strings.
   Strings that are looked up later (tables, constants) are wrapped in the T marker so the check script finds them. */

  const LANGS = [
    { tag: 'en-US', base: 'en', label: 'English (United States)', short: 'English' },
    { tag: 'es-US', base: 'es', label: 'Español (Estados Unidos)', short: 'Español' },
    { tag: 'fr-FR', base: 'fr', label: 'Français (France)', short: 'Français' },
    { tag: 'zh-CN', base: 'zh', label: '中文(简体，中国)', short: '中文' },
    { tag: 'en-GB', base: 'en', label: 'English (United Kingdom)' },
    { tag: 'en-CA', base: 'en', label: 'English (Canada)' },
    { tag: 'es-MX', base: 'es', label: 'Español (México)' },
    { tag: 'fr-CA', base: 'fr', label: 'Français (Canada)' },
    { tag: 'de-DE', base: null, label: 'Deutsch (Deutschland)' },
    { tag: 'it-IT', base: null, label: 'Italiano (Italia)' },
    { tag: 'pt-BR', base: null, label: 'Português (Brasil)' },
    { tag: 'ja-JP', base: null, label: '日本語 (日本)' },
  ];
  const TOP = LANGS.slice(0, 4);

  const strings = {}; // 'es' | 'fr-CA' | ... -> { 'English text': 'translation' | { one, other } }
  const names = {};   // base -> { region | country | state | city: { 'English name': 'translated name' } }
  let cur = LANGS[0];
  let rules = new Intl.PluralRules('en');

  const add = (code, map) => { strings[code] = Object.assign(strings[code] || {}, map); };
  const addNames = (base, map) => { names[base] = map; };
  const byTag = (tag) => LANGS.find((l) => l.tag === tag) || null;

  const lookup = (key) => {
    const own = strings[cur.tag];
    if (own && own[key] !== undefined) return own[key];
    const base = strings[cur.base];
    return base ? base[key] : undefined;
  };
  const fill = (s, p) => (p ? s.replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m)) : s);
  /* Variant rules applied on top of the base translation. Canadian French writes ? and ! without a space
     before them and says "détaillant" where France says "revendeur". */
  const RULES = {
    'fr-CA': [[/[\u00a0\u202f ]+([?!])/g, '$1'], [/revendeur/g, 'détaillant'], [/Revendeur/g, 'Détaillant']],
  };
  const post = (s) => { const r = RULES[cur.tag]; return r ? r.reduce((x, [re, to]) => x.replace(re, to), s) : s; };

  const T = (s) => s;
  const t = (key, p) => { const v = lookup(key); return post(fill(typeof v === 'string' ? v : key, p)); };
  const tn = (key, n, p) => {
    let v = lookup(key);
    if (v === undefined) v = (strings.en || {})[key];
    const s = v && typeof v === 'object' ? (v[rules.select(n)] !== undefined ? v[rules.select(n)] : v.other) : (typeof v === 'string' ? v : key);
    return post(fill(s, Object.assign({ n }, p)));
  };

  const clean = (s) => s.replace(/\u202f/g, ' ');

  const date = (d) => clean(new Intl.DateTimeFormat(cur.tag, { year: 'numeric', month: 'numeric', day: 'numeric' }).format(d || MOMENT));
  const pct = (n) => clean(new Intl.NumberFormat(cur.tag, { style: 'percent' }).format(n / 100));
  const UNIT = { mi: T('mi'), km: T('km') };

  /* ---- place names: region, country, state and city names are translated; abbreviations stay ---- */
  const ABBR = { Washington: 'WA', Oregon: 'OR', California: 'CA', Texas: 'TX', 'New York': 'NY', 'British Columbia': 'BC', Ontario: 'ON', Quebec: 'QC' };

  const place = (state, cityLabel) => {
    const a = ABBR[state];
    if (cur.base === 'zh') return (a ? gname('state', state) : '') + cityLabel;
    return a ? `${cityLabel}, ${a}` : cityLabel;
  };
  /* "Seattle, WA, United States" (Chinese: 美国华盛顿州西雅图) */
  const locLabel = (loc) => {
    const c = gname('city', loc.city), co = gname('country', loc.country), a = ABBR[loc.state];
    if (cur.base === 'zh') return co + (a ? gname('state', loc.state) : '') + c;

  };

  /* Switch language. Returns false (and changes nothing) for a language that is not translated yet. */
  const set = (tag) => {
    const l = byTag(tag);

    cur = l;
    rules = new Intl.PluralRules(l.tag);

  R.i18n = {
    LANGS, TOP, ABBR, strings, names, add, addNames, byTag, set, t, tn, T, lower, num, time, date, pct, dist,
    gname, place, locLabel, stateLabel, inSentence,
    get tag() { return cur.tag; },
    get base() { return cur.base; },
    get lang() { return cur; },
  };
})(window.RDX);

    { key: 'everyday', code: 'BBYUSEveryday', get name() { return t('Everyday Productivity PCs'); }, get pos() { return t('For everyday projects, school, and multitasking'); } },
    { key: 'premium', code: 'BBYUSPremium', get name() { return t('Premium Performance PCs'); }, get pos() { return t('For all-day work performance with gaming power'); } },
    { key: 'creator', code: 'BBYUSCreator', get name() { return t('Creator Pro PCs'); }, get pos() { return t('For advanced apps, creation, and design'); } },
    { key: 'gaming', code: 'BBYUSGaming', get name() { return t('Power Gaming PCs'); }, get pos() { return t('For immersive gaming and beyond'); } },
  ];
  /* Sample values on the static design screens */
  const SAMPLE_LOC = { region: 'North America', country: 'United States', state: 'Washington', city: 'Seattle' };
  const samplePlace = () => L.place(SAMPLE_LOC.state, L.gname('city', SAMPLE_LOC.city));
  const SAMPLE_STORES = [['123', 'Seattle', 0.4], ['346', 'Bellevue', 9.8], ['789', 'Tukwila', 12.1]];

  /* ---------- building blocks ---------- */
  const btn = (label, c = '', attrs = '') => `<span class="btn ${c}" ${attrs ? `${attrs} tabindex="0" role="button"` : ''}>${label}</span>`;
  const sys = (kb) => `<div class="sys">${kb ? I.keyboard(20) : ''}${I.access(20)}${I.volume(20)}</div>`;
  const stepper = (cur) => `<div class="stepper">` + stepLabels().map((s, i) =>
    (i ? `<span class="seg ${i <= cur ? 'on' : ''}"></span>` : '') +
    `<div class="st ${i < cur ? 'done' : i === cur ? 'cur' : ''}"><span class="dot">${i < cur ? I.check(12) : ''}</span><span class="lbl">${s}</span></div>`
  ).join('') + `</div>`;

  function shell(o) {
    return `<div class="scr ${o.cls || ''}" lang="${L.tag}">
      <div class="card">
        ${o.back === false ? '' : `<div class="back" ${o.backAttrs ? `${o.backAttrs} tabindex="0" role="button" aria-label="${t('Back')}"` : ''}>${I.back(20)}</div>`}
        ${o.step != null ? stepper(o.step) : ''}
        ${o.pill === false ? '' : `<div class="pill"><i></i>RDX</div>`}
        ${o.art !== undefined ? `<div class="left" ${o.leftAttrs || ''}>${o.art}</div>` : ''}
        ${o.body !== undefined ? `<div class="right" ${o.rstyle ? `style="${o.rstyle}"` : ''}>${o.body}</div>` : ''}
        ${o.extra || ''}
        ${o.adv ? `<div class="adv" ${o.advAttrs || ''}>${I.sliders(18)}<span>${t('Advanced configuration')}</span></div>` : ''}
        ${o.actions ? `<div class="actions">${o.actions}</div>` : ''}
      </div>
      ${sys(o.kb)}
      ${o.overlay || ''}
    </div>`;
  }

  const factIcon = (f) => f.ok ? I.shield(18) : f.i === 'wifi' ? I.wifi(18) : I.info(18);
  function confirm(o) {
    return shell({
      step: o.step, adv: true, art: o.art, advAttrs: o.advAttrs, backAttrs: o.backAttrs,
      body: `<h1>${o.title}</h1>
        <div class="kicker">${o.kicker}</div>
        <div class="detected"><span class="ico">${o.icon}</span><div><div class="v">${o.value}</div>${o.sub ? `<div class="s">${o.sub}</div>` : ''}</div></div>
        <ul class="facts">${o.facts.map((f) => `<li class="${f.ok ? 'ok' : ''}">${factIcon(f)}<span>${f.t}</span></li>`).join('')}</ul>`,
      rstyle: 'top:96px',
      actions: btn(t('No'), '', o.noAttrs || '') + btn(o.yes || t('Yes'), 'primary', o.yesAttrs || ''),
    });
  }

  const item = (name, { sel, tag, code, sub, attrs } = {}) =>
    `<div class="item ${sel ? 'sel' : ''}"${attrs ? ' ' + attrs : ''}><div class="t"><b>${name}</b>${sub ? `<small>${sub}</small>` : ''}</div>${code ? `<code>${code}</code>` : ''}${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
  const search = (ph) => `<div class="search">${I.search(18)}<span>${ph}</span></div>`;
  const sbox = (v, o = {}) => `<div class="sbox ${o.cls || ''}"><span ${o.ph ? 'class="ph"' : ''}>${v}</span>${o.icon === 'none' ? '' : (o.up ? I.chevUp(18) : I.chevDown(18))}</div>`;
  const field = (lab, box, cap, style) => `<div class="field" ${style ? `style="${style}"` : ''}><div class="lab">${lab}</div>${box}${cap || ''}</div>`;

  /* ---------- 00–03 entry & basics ---------- */
  /* the first seven rows are visible without scrolling: English, Español, Français and 中文 come first, then variants */
  const langList = () => `<div class="list fade" style="height:372px;overflow:hidden">${L.LANGS.slice(0, 7).map((l) => item(l.label, { sel: l.tag === L.tag, attrs: `data-lang="${l.tag}"` })).join('')}</div>`;
  const language = (o = {}) => shell({
    back: false, pill: o.pill !== false, art: A.language(), overlay: o.overlay, cls: o.cls,
    body: `<h1>${t('Let’s start with your language')}</h1>${langList()}`,
    actions: btn(t('Next'), 'primary'),
  });

  const tap5 = () => language({
    pill: false, cls: 'dim',
    overlay: `<div class="scrim"></div>
      <div class="dialog">
        <div class="rdxm">${I.rdxMark(60)}</div>
        <div class="taps">${[1, 2, 3, 4, 5].map((n) => `<span class="tap">${n}</span>`).join('')}</div>
        <h2>${t('RDX enablement activated')}</h2>
        <p>${t('5 taps detected. This device will be set up as a retail demo device.')}</p>
        <div class="row">${btn(t('Cancel'))}${btn(t('Continue'), 'primary')}</div>
      </div>`,
  });

  const network = () => shell({
    art: A.wifi(), kb: true,
    body: `<h1>${t('Let’s connect you to a network')}</h1>
      <p class="hint">${t('RDX needs an internet connection to find your store details and download demo content.')}</p>
      <div class="nets">
        <div class="net sel">
          <div class="r1">${I.wifi(20)}<span>Store-Retail-WiFi</span></div>
          <div class="sub">${t('Secure')}</div>
          <div class="chk"><span class="cb">${I.check(12)}</span>${t('Connect automatically')}</div>
          <span class="btn primary go" style="min-width:104px;height:36px">${t('Connect')}</span>
        </div>
        <div class="net">${I.wifi(20)}<span>Store-Guest</span></div>
        <div class="net">${I.wifi(20)}<span>Contoso-Demo</span></div>
        <div class="net">${I.wifi(20)}<span>ContosoNet2216</span></div>
      </div>`,
    actions: btn(t('Learn more'), 'link'),
  });

  const detecting = () => shell({
    art: A.radar(), rstyle: 'top:70px',
    body: `<div class="busy">
        <div class="spin"></div>
        <div class="txt">${t('Finding your store details')}</div>
        <div class="sub">${t('This usually takes a few seconds.')}</div>
        <div class="steps">
          <div class="stp done"><span class="ic">${I.check(12)}</span>${t('Connected to {net}', { net: 'Store-Retail-WiFi' })}</div>
          <div class="stp done"><span class="ic">${I.check(12)}</span>${t('Location found')}</div>
          <div class="stp now"><span class="ic"></span>${t('Checking retailer and store…')}</div>
          <div class="stp wait"><span class="ic"></span>${t('Checking this device')}</div>
        </div>
      </div>`,
  });

  /* ---------- 04–08 guided setup ---------- */
  const location = () => confirm({
    step: 0, art: A.pin(), title: t('Is this the right location?'), kicker: t('Location detected'),
    icon: I.pin(26), value: L.locLabel(SAMPLE_LOC),
    facts: [{ t: t('Detected from this device’s network connection.'), i: 'wifi' }, { t: t('We use your location to suggest the right retailer, store and demo content.') }],
  });

  const locationManual = () => shell({
    step: 0, adv: true, art: A.globe(),
    body: `<h1>${t('Where is this device?')}</h1>
      <p class="hint">${t('Each list only shows options that apply to your previous choice.')}</p>
      <div class="g2" style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">
        ${field(t('Region'), sbox(L.gname('region', 'North America')))}
        ${field(t('Country'), sbox(L.gname('country', 'United States')))}
      </div>
      ${field(t('State or province'), sbox(t('Select a {label}', { label: L.lower(t('State or province')) }), { cls: 'focus', ph: 1, up: 1 }) +
        `<div class="menu">${['Vermont', 'Virginia', 'Washington', 'West Virginia', 'Wisconsin'].map((s) => `<div class="${s === 'Washington' ? 'on' : ''}">${L.gname('state', s)}</div>`).join('')}</div>`, '', 'z-index:6')}
      ${field(t('City or area'), sbox(t('Choose a {label} first', { label: L.lower(t('State or province')) }), { cls: 'dis' }))}`,
    actions: btn(t('Confirm'), 'primary disabled'),
  });

  const retailer = () => confirm({
    step: 1, art: A.store(), title: t('Is this the right retailer?'), kicker: t('Retailer detected'),
    icon: I.store(26), value: 'Best Buy', sub: t('Retailer for {place}', { place: samplePlace() }),
    facts: [{ t: t('Another RDX device on this network is already registered with this retailer.') }, { t: t('Only retailers available in {country} are suggested.', { country: L.inSentence('United States') }) }],
  });

  const retailerManual = () => shell({
    step: 1, adv: true, art: A.store(),
    body: `<h1>${t('Choose your retailer')}</h1>
      <p class="hint">${t('Showing retailers in {country}.', { country: L.inSentence('United States') })}</p>
      ${search(t('Search retailers'))}
      <div class="list">
        ${item('Best Buy', { sel: 1, tag: t('Detected') })}${item('Contoso Electronics')}${item('Fabrikam Retail')}${item('Northwind Stores')}${item('Tailspin Tech')}
      </div>`,
    actions: btn(t('Confirm'), 'primary'),
  });

  const store = () => confirm({
    step: 2, art: A.storeid(t('STORE')), title: t('Is this the right store?'), kicker: t('Store detected'),
    icon: I.building(26), value: t('Store {id}', { id: '123' }), sub: `Best Buy · ${samplePlace()}`,
    facts: [{ t: t('Verified with DMS'), ok: 1 }, { t: t('Matches the location you confirmed.') }],
  });

  const storeManual = () => shell({
    step: 2, adv: true, art: A.storeid(t('STORE')),
    body: `<h1>${t('Choose your store')}</h1>
      <p class="hint">${t('{retailer} stores near {place}.', { retailer: 'Best Buy', place: samplePlace() })}</p>
      ${search(t('Search by store ID or city'))}
      <div class="list">
        ${SAMPLE_STORES.map(([id, city, d], i) => item(t('Store {id}', { id }), { sel: i === 0, sub: `${L.place(SAMPLE_LOC.state, L.gname('city', city))} · ${L.dist(d, 'mi')}`, tag: i === 0 ? t('Detected') : '' })).join('')}
      </div>
      <div class="more">${I.plus(16)} ${t('Enter a Store ID manually')}</div>`,
    actions: btn(t('Confirm'), 'primary'),
  });

  const rac = () => confirm({
    step: 3, art: A.gaming(), title: t('Is this a {name} device?', { name: COLLECTIONS[4].name }), kicker: t('Collection detected'),
    icon: I.gamepad(26), value: COLLECTIONS[4].name, sub: `${COLLECTIONS[4].pos}<br>${t('RAC ID')} <code>BBYUSGaming</code>`,
    facts: [{ t: t('Verified with DMS'), ok: 1 }, { t: t('Detected for this device at {retailer}, {place}.', { retailer: 'Best Buy', place: samplePlace() }) }],
  });

  const racManual = () => shell({
    step: 3, adv: true, art: A.gaming(),
    body: `<h1>${t('Choose a collection')}</h1>
      <p class="hint">${t('Collections available for {retailer} in {country}.', { retailer: 'Best Buy', country: L.inSentence('United States') })}</p>
      <div class="list">
        ${COLLECTIONS.map((c, i) => item(c.name, { sel: i === 4, sub: c.pos, code: c.code, tag: i === 4 ? t('Detected') : '' })).join('')}
      </div>
      <div class="more">${I.plus(16)} ${t('Enter a RAC ID manually')}</div>`,
    actions: btn(t('Confirm'), 'primary'),
  });

  const sku = () => confirm({
    step: 4, art: A.sku(), title: t('Is this the right SKU?'), kicker: t('SKU detected'),
    icon: I.barcode(26), value: '06571234', sub: 'Contoso Gaming Laptop 16', yes: t('Yes, start setup'),
    facts: [{ t: t('Read from this device’s firmware. Leading zeros are kept.') }, { t: t('After you confirm, RDX starts setting up this device.') }],
  });

  const skuManual = () => shell({
    step: 4, adv: true, art: A.sku(),
    body: `<h1>${t('Enter the SKU ID')}</h1>
      <p class="hint">${t('The retailer-assigned SKU or item number for this device.')}</p>
      ${field(t('SKU ID'), `<div class="sbox focus"><span>06571234<i class="caret"></i></span></div>`)}
      <ul class="helper">
        <li><b>${t('Meaning:')}</b> ${t('The product identifier in your retailer catalog.')}</li>
        <li><b>${t('Expected:')}</b> ${t('The exact assigned SKU or item number — keep any leading zeros.')}</li>
        <li><b>${t('Where to find it:')}</b> ${t('Product label, retailer catalog or inventory system.')}</li>
      </ul>`,
    actions: btn(t('Start setup'), 'primary'),
  });

  /* ---------- 09 advanced configuration ---------- */
  const advanced = () => shell({
    back: false,
    extra: `
      <div class="ah"><h1>${t('Advanced configuration')}</h1><p>${t('Review or change everything on one screen. Only options that apply to this store are shown.')}</p></div>
      <div class="af">
        <div class="sec">${t('Location')}<span class="only" style="margin-left:auto;text-transform:none;letter-spacing:0">${I.sliders(14)} ${t('Showing only options for this store')}</span></div>
        <div class="g4">
          ${field(t('Region'), sbox(L.gname('region', 'North America')))}
          ${field(t('Country'), sbox(L.gname('country', 'United States')))}
          ${field(t('State or province'), sbox(L.gname('state', 'Washington')))}
          ${field(t('City or area'), sbox(L.gname('city', 'Seattle')))}
        </div>
        <div class="sec">${t('Retail details')}</div>
        <div class="g2">
          ${field(t('Retailer'), sbox('Best Buy'), `<div class="cap">${tn('{n} retailers in {country}', 5, { country: L.inSentence('United States') })}</div>`)}
          ${field(t('Store ID'), sbox(`123 · ${samplePlace()}`), `<div class="cap ok">${I.check(13)} ${t('Verified with DMS')} · ${tn('{n} stores near {city}', 3, { city: L.gname('city', 'Seattle') })}</div>`)}
          ${field(t('RAC ID'), sbox(`${COLLECTIONS[4].name} · BBYUSGaming`), `<div class="cap ok">${I.check(13)} ${t('Verified with DMS')} · ${tn('{n} collections for {retailer}', 5, { retailer: 'Best Buy' })}</div>`)}
          ${field(t('SKU ID'), `<div class="sbox"><span>06571234</span></div>`, `<div class="cap">${t('Detected from this device · leading zeros kept')}</div>`)}
        </div>
      </div>
      <div class="aside">
        <div class="panel"><h3>${I.info(20)} ${t('Why these details are pre-filled')}</h3>
          <p>${t('Another RDX device on this network has a DMS-validated RAC ID and Store ID that match your detected location, so we used the same details here.')}</p></div>
        <div class="panel"><h3>${I.shield(20)} ${t('DMS validation')}</h3>
          <div class="vrow"><span class="ic">${I.check(13)}</span>${t('Store ID verified')}</div>
          <div class="vrow"><span class="ic">${I.check(13)}</span>${t('RAC ID verified')}</div>
          <p style="margin-top:10px">${t('The selected RAC ID and Store ID have been validated with DMS.')}</p>
          ${btn(I.refresh(16) + ' ' + t('Validate again'))}</div>
      </div>
      <div class="adv" style="left:70px">${I.back(18)}<span>${t('Back to guided setup')}</span></div>
      <div class="actions">${btn(t('Apply and start setup'), 'primary')}</div>`,
  });

  /* ---------- 10–12 RDX is cooking ---------- */
  const taskRow = ([k, name, p]) =>
    `<div class="task ${k}"><span class="ic">${k === 'ok' ? I.check(16) : ''}</span><div class="nm">${t(name)}${k === 'now' ? `<div class="pb"><i style="width:${p}%"></i></div>` : ''}</div><span class="st">${k === 'ok' ? t('Done') : k === 'now' ? L.pct(p) : t('Waiting')}</span></div>`;
  const TASKS = {
    a: [['now', T('Updating Windows'), 72], ['wait', T('Updating app')], ['wait', T('Downloading Attract loop')], ['wait', T('Updating Demo Hub')]],
    b: [['ok', T('Updating Windows')], ['ok', T('Updating app')], ['now', T('Downloading Attract loop'), 64], ['wait', T('Updating Demo Hub')]],
    done: [['ok', T('Updating Windows')], ['ok', T('Updating app')], ['ok', T('Downloading Attract loop')], ['ok', T('Updating Demo Hub')]],
  };
  const recap = () => `<div class="recap">
    <span class="rchip">${I.pin(14)}${samplePlace()}</span><span class="rchip">${I.store(14)}Best Buy</span>
    <span class="rchip">${I.building(14)}${t('Store {id}', { id: '123' })}</span><span class="rchip">${I.gamepad(14)}${COLLECTIONS[4].name} · BBYUSGaming</span><span class="rchip">${I.barcode(14)}${t('SKU {id}', { id: '06571234' })}</span></div>`;
  const cooking = (st) => {
    const done = st === 'done';
    return shell({
      back: false, art: A.cook(done ? 'done' : 'start'), extra: recap(), rstyle: 'top:62px',
      body: `${done ? `<div class="lockpill ok">${I.check(16)} ${t('Setup complete')}</div>` : `<div class="lockpill">${I.lock(16)} ${t('This device is locked while we finish setup')}</div>`}
        <h1>${done ? t('All done!') : t('RDX is cooking in the background')}</h1>
        <div class="sub2">${done ? t('RDX is ready. Your device is set up and good to go.') : t('Stay connected while we finish up.')}</div>
        <div class="tasks">${TASKS[st].map(taskRow).join('')}</div>
        ${done ? '' : `<div class="funny">${I.sparkle(18)}<span>${t('Hands off, chef at work! Good demos take a few minutes to simmer. This screen unlocks when everything turns green.')}</span></div>`}`,
      actions: done ? btn(t('Continue'), 'primary') : '',
    });
  };

  /* ---------- 13 Windows 11 desktop, configured for RDX ---------- */
  const COLL_ICON = { core: I.laptop, everyday: I.app, premium: I.sparkle, creator: I.film, gaming: I.gamepad };
  const deskDefault = () => ({ retailer: 'Best Buy', store: '123', key: 'gaming', name: COLLECTIONS[4].name, pos: COLLECTIONS[4].pos, code: 'BBYUSGaming' });
  /* Demo Hub tile text is placeholder content */
  const DESK_TILES = {
    core: [[T('Everyday apps'), T('Browse, email and more')], [T('Streaming'), T('Movies, music and TV')], [T('Battery life'), T('Stay unplugged longer')]],
    everyday: [[T('Projects'), T('Docs, slides and more')], [T('School and study'), T('Notes, research, homework')], [T('Multitasking'), T('Snap layouts and desktops')]],
    premium: [[T('All-day performance'), T('Power through your workday')], [T('Gaming power'), T('Play when work is done')], [T('Display and audio'), T('Sharper, louder, clearer')]],
    creator: [[T('Creative apps'), T('Photo, video and music')], [T('Editing and design'), T('Fast, fluid workflows')], [T('Pro displays'), T('True-to-life color')]],
    gaming: [[T('Featured games'), T('Curated for gaming PCs')], [T('Performance'), T('Frame rates and graphics')], [T('Accessories'), T('Controllers and headsets')]],
  };
  const TILE_BG = ['linear-gradient(135deg,#1b8cf6,#5b3dd6)', 'linear-gradient(135deg,#2fbf6b,#0f9d4a)', 'linear-gradient(135deg,#ff9f43,#ff6a3d)'];
  const desktop = (info) => {
    info = info || deskDefault();
    const tiles = DESK_TILES[info.key] || DESK_TILES.core;
    const collIcon = (COLL_ICON[info.key] || I.laptop)(14);
    const ti = (inner, cls = '') => `<div class="ti ${cls}">${inner}</div>`;
    const folder = `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#f4c04c"/><path d="M3 10h18v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#f9d97c"/></svg>`;
    const browser = `<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#1fa7a0"/><path d="M4.5 14.5a8 8 0 0 0 14.5-3.2c0-3.2-2.6-5-5.2-5-3.3 0-6 2.4-6 5.3 0 1.6 1.2 2.6 2.7 2.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="10" fill="none" stroke="#1b6fd6" stroke-width="2" stroke-dasharray="30 40" transform="rotate(-30 12 12)"/></svg>`;
    const storeI = `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 8h14l-1 12H6z" fill="#2a6fdb"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="#2a6fdb" stroke-width="1.8"/><g><rect x="8.4" y="11" width="3.2" height="3.2" fill="#f25022"/><rect x="12.4" y="11" width="3.2" height="3.2" fill="#7fba00"/><rect x="8.4" y="15" width="3.2" height="3.2" fill="#00a4ef"/><rect x="12.4" y="15" width="3.2" height="3.2" fill="#ffb900"/></g></svg>`;
    const taskview = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1b1f27" stroke-width="1.6"><rect x="3" y="6" width="12" height="10" rx="2"/><path d="M9 19h9a3 3 0 0 0 3-3V9" stroke-linecap="round"/></svg>`;
    const games = `<svg viewBox="0 0 24 24" width="26" height="26"><rect x="1" y="1" width="22" height="22" rx="6" fill="#107c10"/><g color="#fff" transform="translate(3 3) scale(.75)">${I.gamepad(24)}</g></svg>`;
    const recycle = `<svg viewBox="0 0 44 44" width="44" height="44"><path d="M10 14h24l-2 26H12z" fill="#eef4fc" stroke="#9db4d8" stroke-width="1.5"/><path d="M8 14h28" stroke="#9db4d8" stroke-width="2.5" stroke-linecap="round"/><path d="M17 9h10v5H17z" fill="#c8d8f0"/><path d="M17 20v14M22 20v14M27 20v14" stroke="#b3c6e4" stroke-width="1.5"/></svg>`;
    return `<div class="scr desktop" lang="${L.tag}">
      ${A.wallpaper()}
      <div class="dicons">
        <div class="dicon"><div class="g">${recycle}</div>${t('Recycle Bin')}</div>
        <div class="dicon"><div class="g">${I.hubMark(44)}</div>Demo Hub</div>
      </div>
      <div class="win">

<script>
/* RDX OOBE prototype — sample data. Retailer names other than the ones in the current RDX screen,
   plus all store IDs, SKUs and RAC codes except BBYUSGaming, are placeholders for the prototype. */
window.RDX = window.RDX || {};
(function (R) {
  const D = {};
  const COLL = R.ui.COLLECTIONS;
  const SUFFIX = { core: 'Core', everyday: 'Everyday', premium: 'Premium', creator: 'Creator', gaming: 'Gaming' };

  /* The language list lives in i18n.js (RDX.i18n.LANGS). */
  D.networks = [
    { name: 'Store-Retail-WiFi', secure: true },
    { name: 'Store-Guest', secure: false },
    { name: 'Contoso-Demo', secure: true },
    { name: 'ContosoNet2216', secure: true },
  ];
  D.sku = { id: '06571234', name: 'Contoso Gaming Laptop 16' };

  /* QR setup (mobile app): the sample Wi-Fi password and the boxes the phone can "scan".
     The UPC on the box maps to the retailer's SKU and to the collection that SKU belongs to. */
  D.wifiPassword = 'RetailDemo2026!';
  const upcA = (base) => { const sum = base.split('').reduce((a, ch, i) => a + (i % 2 === 0 ? +ch * 3 : +ch), 0); return base + ((10 - (sum % 10)) % 10); };
  D.products = [
    { key: 'gaming', sku: D.sku.id, upc: upcA('01234567890'), name: D.sku.name },
    { key: 'everyday', sku: '06482910', upc: upcA('04567890123'), name: 'Contoso Everyday Laptop 15' },
    { key: 'creator', sku: '06715532', upc: upcA('07890123456'), name: 'Contoso Creator Studio 16' },
  ];
  D.upcText = (u) => `${u[0]} ${u.slice(1, 6)} ${u.slice(6, 11)} ${u[11]}`;
  D.RETAILER_SITE = { 'Best Buy': 'bestbuy.com', 'Best Buy Canada': 'bestbuy.ca' };

  /* Region > Country > State/Province > City */
  D.geo = {
    'North America': {
      'United States': {
        'Washington': ['Seattle', 'Bellevue', 'Tukwila', 'Spokane'],
        'Oregon': ['Portland', 'Salem', 'Eugene'],
        'California': ['Los Angeles', 'San Francisco', 'San Diego', 'San Jose'],
        'Texas': ['Austin', 'Dallas', 'Houston'],
        'New York': ['New York', 'Buffalo', 'Albany'],
      },
      'Canada': {
        'British Columbia': ['Vancouver', 'Victoria', 'Kelowna'],
        'Ontario': ['Toronto', 'Ottawa', 'Mississauga'],
        'Quebec': ['Montréal', 'Québec City'],
      },
    },
    'Europe': {
      'France': { 'Île-de-France': ['Paris', 'Versailles'], 'Auvergne-Rhône-Alpes': ['Lyon', 'Grenoble'], 'Provence-Alpes-Côte d’Azur': ['Marseille', 'Nice'] },
      'United Kingdom': { 'England': ['London', 'Manchester', 'Birmingham'], 'Scotland': ['Edinburgh', 'Glasgow'], 'Wales': ['Cardiff', 'Swansea'] },
      'Germany': { 'Berlin': ['Berlin'], 'Bavaria': ['Munich', 'Nuremberg'], 'Hesse': ['Frankfurt', 'Wiesbaden'] },
    },
    'Asia Pacific': {
      'Japan': { 'Tokyo': ['Shinjuku', 'Shibuya', 'Akihabara'], 'Osaka': ['Osaka', 'Namba'] },
      'Australia': { 'New South Wales': ['Sydney', 'Newcastle'], 'Victoria': ['Melbourne', 'Geelong'] },
    },
  };
  D.abbr = R.i18n.ABBR;
  D.stateLabel = (country) => R.i18n.stateLabel(country);

  D.regions = () => Object.keys(D.geo);
  D.countries = (r) => Object.keys(D.geo[r] || {});
  D.states = (r, c) => Object.keys((D.geo[r] || {})[c] || {});
  D.cities = (r, c, s) => (((D.geo[r] || {})[c] || {})[s]) || [];

  D.retailers = {
    'United States': ['Best Buy', 'Contoso Electronics', 'Fabrikam Retail', 'Northwind Stores', 'Tailspin Tech'],
    Canada: ['Best Buy Canada', 'Contoso Electronics', 'Fabrikam Retail'],
    France: ['Boulanger', 'Contoso Electronics'],
    'United Kingdom': ['Dixons (Currys)', 'Contoso Electronics'],
    Germany: ['Contoso Electronics', 'Fabrikam Retail'],
    Japan: ['BIC Camera', 'Contoso Electronics'],
    Australia: ['Contoso Electronics', 'Northwind Stores'],
  };
  D.retailersFor = (country) => D.retailers[country] || [];
  D.defRetailer = (country) => D.retailersFor(country)[0];

  /* Which of the five collections each retailer has (shows the "only relevant options" filtering) */
  D.racKeys = {
    'Best Buy': ['core', 'everyday', 'premium', 'creator', 'gaming'],
    'Best Buy Canada': ['core', 'everyday', 'premium', 'creator', 'gaming'],
    'Boulanger': ['core', 'everyday', 'premium', 'gaming'],
    'Dixons (Currys)': ['core', 'everyday', 'premium'],
    'BIC Camera': ['core', 'everyday', 'premium', 'creator', 'gaming'],
    'Contoso Electronics': ['core', 'everyday', 'premium', 'creator'],
    'Fabrikam Retail': ['core', 'everyday', 'gaming'],
    'Northwind Stores': ['core', 'everyday', 'premium'],
    'Tailspin Tech': ['core', 'gaming'],
  };
  const RET_ABBR = { 'Best Buy': 'BBY', 'Best Buy Canada': 'BBY', Boulanger: 'BOU', 'Dixons (Currys)': 'DIX', 'BIC Camera': 'BIC', 'Contoso Electronics': 'CTS', 'Fabrikam Retail': 'FAB', 'Northwind Stores': 'NWS', 'Tailspin Tech': 'TSP' };
  const CC = { 'United States': 'US', Canada: 'CA', France: 'FR', 'United Kingdom': 'UK', Germany: 'DE', Japan: 'JP', Australia: 'AU' };

  D.racsFor = (retailer, country) => (D.racKeys[retailer] || ['core']).map((k) => {
    const c = COLL.find((x) => x.key === k);
    return { key: k, name: c.name, pos: c.pos, code: `${RET_ABBR[retailer] || 'RDX'}${CC[country] || 'XX'}${SUFFIX[k]}` };
  });
  D.defRac = (retailer) => { const ks = D.racKeys[retailer] || ['core']; return ks.includes('gaming') ? 'gaming' : ks[0]; };

  const hash = (s) => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  /* Store records hold language-neutral parts (city key, optional North/South suffix, distance and unit).
     Text is built when it is shown, so it follows the selected language: D.storePlace(store, loc), D.storeDist(store). */
  const SUFFIX_TEXT = { North: R.i18n.T('{city} North'), South: R.i18n.T('{city} South') };
  D.storesFor = (retailer, loc) => {
    if (retailer === 'Best Buy' && loc.city === 'Seattle') {
      return [{ id: '123', city: 'Seattle', dist: 0.4, unit: 'mi' }, { id: '346', city: 'Bellevue', dist: 9.8, unit: 'mi' }, { id: '789', city: 'Tukwila', dist: 12.1, unit: 'mi' }];
    }
    const metric = !['United States', 'United Kingdom'].includes(loc.country);
    const near = D.cities(loc.region, loc.country, loc.state).filter((c) => c !== loc.city);
    const places = [{ city: loc.city }, near[0] ? { city: near[0] } : { city: loc.city, suffix: 'North' }, near[1] ? { city: near[1] } : { city: loc.city, suffix: 'South' }];
    const dist = metric ? [0.7, 13.2, 23.4] : [0.4, 8.2, 14.5];
    const h = hash(`${retailer}|${loc.city}`);
    const ids = [100 + (h % 800), 100 + ((h * 7 + 13) % 800), 100 + ((h * 13 + 29) % 800)];
    if (ids[1] === ids[0]) ids[1] += 1;
    if (ids[2] === ids[0] || ids[2] === ids[1]) ids[2] += 2;
    return ids.map((id, i) => ({ id: String(id), ...places[i], dist: dist[i], unit: metric ? 'km' : 'mi' }));
  };
  D.storePlace = (s, loc) => {
    const city = R.i18n.gname('city', s.city);
    return R.i18n.place(loc.state, s.suffix ? R.i18n.t(SUFFIX_TEXT[s.suffix], { city }) : city);
  };
  D.storeDist = (s) => R.i18n.dist(s.dist, s.unit);
  D.defStore = (retailer, loc) => D.storesFor(retailer, loc)[0].id;

  D.locLabel = (loc) => R.i18n.locLabel(loc);
  D.shortPlace = (loc) => R.i18n.place(loc.state, R.i18n.gname('city', loc.city));

  R.data = D;
})(window.RDX);

</script>

  const VERIFY = { store: [T('Store ID verified'), T('Store ID verifying…')], rac: [T('RAC ID verified'), T('RAC ID verifying…')] };
  function rAdv() {
    const c = S.cur, l = c.loc, rets = D.retailersFor(l.country), racs = racList(), stores = storeList(), rac = racObj(), st = storeObj();
    const chk = S.dms === 'checking' ? `<i class="mini-spin dark"></i> ${t('Verifying with DMS…')}` : `${I.check(13)} ${t('Verified with DMS')}`;
    const vrow = (k) => S.dms === 'checking' ? `<div class="vrow"><span class="ic wait"><i class="mini-spin dark"></i></span>${t(VERIFY[k][1])}</div>` : `<div class="vrow"><span class="ic">${I.check(13)}</span>${t(VERIFY[k][0])}</div>`;
    return U.shell({
      back: false,
      extra: `
        <div class="ah"><h1>${t('Advanced configuration')}</h1><p>${t('Review or change everything on one screen. Only options that apply to this store are shown.')}</p></div>
        <div class="af">
          <div class="sec">${t('Location')}<span class="only" style="margin-left:auto;text-transform:none;letter-spacing:0">${I.sliders(14)} ${t('Showing only options for this store')}</span></div>
          <div class="g4">
            ${dd('a.region', t('Region'), gn('region', l.region), opts(D.regions(), 'region'), { value: l.region })}
            ${dd('a.country', t('Country'), gn('country', l.country), opts(D.countries(l.region), 'country'), { value: l.country })}
            ${dd('a.state', D.stateLabel(l.country), gn('state', l.state), opts(D.states(l.region, l.country), 'state'), { value: l.state })}

          </div>

            ${dd('a.store', t('Store ID'), `${esc(st.id)} · ${storeText(st)}`, stores.map((s) => ({ v: s.id, t: `${s.id} · ${storeText(s)}` })), { value: c.store, cap: `<div class="cap ok">${chk} · ${tn('{n} stores near {city}', stores.length, { city: i18n.gname('city', l.city) })}</div>` })}
            ${dd('a.rac', t('RAC ID'), `${rac.name} · ${esc(rac.code)}`, racs.map((r) => ({ v: r.key, t: `${r.name} · ${r.code}` })), { value: c.rac, cap: `<div class="cap ok">${chk} · ${tn('{n} collections for {retailer}', racs.length, { retailer: c.retailer })}</div>` })}
            <div class="field"><div class="lab">${t('SKU ID')}</div><div class="sbox"><input data-f="sku" data-input="advSku" value="${esc(c.sku)}" placeholder="${esc(t('Enter the retailer-assigned SKU or item number'))}" autocomplete="off"></div><div class="cap">${c.sku === D.sku.id ? t('Detected from this device · leading zeros kept') : t('Entered manually · leading zeros kept')}</div></div>
          </div>
        </div>
        <div class="aside">
          <div class="panel"><h3>${I.info(20)} ${t('Why these details are pre-filled')}</h3>
            <p>${t('Another RDX device on this network has a DMS-validated RAC ID and Store ID that match your detected location, so we used the same details here.')}</p></div>
          <div class="panel"><h3>${I.shield(20)} ${t('DMS validation')}</h3>
            ${vrow('store')}${vrow('rac')}
            <p style="margin-top:10px">${t('The selected RAC ID and Store ID have been validated with DMS.')}</p>
            ${U.btn(I.refresh(16) + ' ' + t('Validate again'), '', 'data-act="validate"')}</div>
        </div>
        <div class="adv" style="left:70px" data-act="adv-back" tabindex="0" role="button">${I.back(18)}<span>${t('Back to guided setup')}</span></div>`,
      actions: primary(t('Apply and start setup'), 'adv-apply'),
    });
  }

  const TASK_NAMES = [T('Updating Windows'), T('Updating app'), T('Downloading Attract loop'), T('Updating Demo Hub')];
  const TASK_SECS = [7, 4, 6, 4];
  const taskRows = () => TASK_NAMES.map((n, i) => {
    const st = S.cook.done || i < S.cook.i ? 'ok' : i === S.cook.i ? 'now' : 'wait', pct = Math.round(S.cook.p * 100);
    return `<div class="task ${st}"><span class="ic">${st === 'ok' ? I.check(16) : ''}</span><div class="nm">${t(n)}${st === 'now' ? `<div class="pb"><i style="width:${pct}%"></i></div>` : ''}</div><span class="st">${st === 'ok' ? t('Done') : st === 'now' ? i18n.pct(pct) : t('Waiting')}</span></div>`;
  }).join('');
  function rCook() {
    const done = S.cook.done, r = racObj(), s = storeObj();
    const recap = `<div class="recap"><span class="rchip">${I.pin(14)}${D.shortPlace(L())}</span><span class="rchip">${I.store(14)}${S.cur.retailer}</span><span class="rchip">${I.building(14)}${t('Store {id}', { id: esc(s.id) })}</span><span class="rchip">${collIcon(r.key, 14)}${r.name} · ${esc(r.code)}</span><span class="rchip">${I.barcode(14)}${t('SKU {id}', { id: esc(S.cur.sku) })}</span></div>`;
    return U.shell({
      back: false, art: A.cook(done ? 'done' : 'start'), extra: recap, rstyle: 'top:62px',
      body: `${done ? `<div class="lockpill ok">${I.check(16)} ${t('Setup complete')}</div>` : `<div class="lockpill">${I.lock(16)} ${t('This device is locked while we finish setup')}</div>`}
        <h1>${done ? t('All done!') : t('RDX is cooking in the background')}</h1>
        <div class="sub2">${done ? t('RDX is ready. Your device is set up and good to go.') : t('Stay connected while we finish up.')}</div>
        <div class="tasks" id="tasks">${taskRows()}</div>
        ${done ? '' : `<div class="funny">${I.sparkle(18)}<span>${t('Hands off, chef at work! Good demos take a few minutes to simmer. This screen unlocks when everything turns green.')}</span></div>`}`,
      actions: done ? primary(t('Continue'), 'cook-continue') : '',
    });
  }
  function runCook() {
    every(() => {
      if (S.cook.done) return;
      S.cook.p += (0.1 * S.speed) / TASK_SECS[S.cook.i];
      if (S.cook.p >= 1) { S.cook.i += 1; S.cook.p = 0; }
      if (S.cook.i >= TASK_NAMES.length) {
        S.cook.done = true; patch('#tasks', taskRows()); clearTimers();
        later(() => { if (S.screen === 'cook') render(); }, 700);
        return;
      }
      patch('#tasks', taskRows());
    }, 100);
  }

  const rDesktop = () => { const r = racObj(); return U.desktop({ retailer: S.cur.retailer, store: storeObj().id, key: r.key, name: r.name, pos: r.pos, code: r.code }); };

  /* ---------- QR setup ----------
     This device shows code 1. The phone (mobile app window) does the setup and shows code 2, which holds the Wi-Fi
     details, store location, retailer, store, RAC and SKU. "I'm ready" opens a simulated camera (the real camera is never
     used); it reads code 2 from the mobile window, or uses sample details when no phone is open. */
  const protoHint = (text, act, linkText) => `<div class="phint"><span>${text}</span>${act ? `<span class="plink" data-act="${act}" tabindex="0" role="button">${linkText}</span>` : ''}</div>`;
  const sampleDetails = () => {
    const rac = D.racsFor('Best Buy', 'United States').find((r) => r.key === 'gaming'), p = D.products[0];
    return { device: DEVICE_ID, ssid: D.networks[0].name, pw: D.wifiPassword, sec: 'WPA2', country: 'United States', state: 'Washington', city: 'Seattle', retailer: 'Best Buy', store: '123', rac: rac.code, sku: p.sku, upc: p.upc, lang: S.lang };
  };
  const productOf = (sku) => D.products.find((p) => p.sku === sku);
  /* Put what the phone sent into the same state the guided questions fill in. Values that are not in the sample data are ignored (location)
     or shown as entered by hand (store, RAC); hand-entered values must look like codes (letters, digits, - and _). */
  const codeLike = (v, max) => typeof v === 'string' && new RegExp(`^[\\w-]{1,${max}}$`).test(v);
  function applyDetails(d) {
    const region = D.regions().find((rg) => D.countries(rg).includes(d.country));
    if (region && D.states(region, d.country).includes(d.state) && D.cities(region, d.country, d.state).includes(d.city)) S.cur.loc = { region, country: d.country, state: d.state, city: d.city };
    S.cur.retailer = D.retailersFor(S.cur.loc.country).includes(d.retailer) ? d.retailer : D.defRetailer(S.cur.loc.country);
    if (D.storesFor(S.cur.retailer, S.cur.loc).some((s) => s.id === d.store)) { S.cur.store = d.store; S.cur.storeCustom = ''; } else if (codeLike(d.store, 12)) { S.cur.store = 'custom'; S.cur.storeCustom = d.store; } else { S.cur.store = D.defStore(S.cur.retailer, S.cur.loc); S.cur.storeCustom = ''; }
    const hit = D.racsFor(S.cur.retailer, S.cur.loc.country).find((r) => r.code === d.rac);
    if (hit) { S.cur.rac = hit.key; S.cur.racCustom = ''; } else if (codeLike(d.rac, 32)) { S.cur.rac = 'custom'; S.cur.racCustom = d.rac; } else { S.cur.rac = D.defRac(S.cur.retailer); S.cur.racCustom = ''; }
    S.cur.sku = codeLike(d.sku, 24) ? d.sku : D.sku.id;
    if (D.networks.some((n) => n.name === d.ssid)) S.net.sel = d.ssid;
    S.edited = {};
  }

  const qrCard = () => `<div class="qrcard"><div class="qrbox">${R.qr.svg(R.qr.setupUrl(DEVICE_ID, S.lang), { size: 296, label: t('QR code') })}</div><div class="qrdev">${I.rdxMark(18)}<span>${t('Device {id}', { id: DEVICE_ID })}</span></div></div>`;
  function rQr() {
    const steps = [t('Scan this code with your phone’s camera.'), t('Follow the steps on your phone.'), t('When your phone shows its code, come back here and select the button below.')];
    return U.shell({
      art: qrCard(), backAttrs: 'data-act="back"', extra: protoHint('Prototype: use “Open mobile app” in the toolbar to see the phone beside this screen.'),
      body: `<h1>${t('Set up with your phone')}</h1><p class="hint">${t('Your phone finds your store, checks the Wi-Fi and reads the barcode on the box. Then it shows a code for this device to scan.')}</p>

      actions: primary(t('I’m ready, I have a QR code'), 'qr-ready'),
    });
  }

  function rScan() {
    const st = S.qr.stage, looking = st === 'search' || st === 'show';
    const head = looking ? t('Show your phone’s QR code to the camera') : st === 'found' ? t('QR code scanned') : t('Opening the camera…');
    const hint = looking ? t('Hold the phone steady, with the code facing this device.') : st === 'found' ? t('Reading your setup details…') : t('This usually takes a few seconds.');
    const latest = link.latest(), text = S.qr.got ? R.qr.encode(S.qr.got) : latest ? latest.text : R.qr.encode(sampleDetails());
    const view = st === 'opening'
      ? '<div class="vfwait"><div class="spin"></div></div>'
      : `<div class="live"><i></i>${I.camera(14)}</div><div class="line"></div>${st === 'search' ? '' : `<div class="ph"><div class="scrn">${R.qr.svg(text, { size: 122, margin: 1 })}</div></div>`}${st === 'found' ? `<div class="vfok">${I.check(44)}</div>` : ''}`;
    const vf = `<div class="vf ${st}"><div class="feed"></div>${view}<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div>`;
    const waiting = S.qr.waiting && st === 'search';
    return U.shell({
      art: vf, backAttrs: 'data-act="back"', rstyle: 'top:190px',
      extra: protoHint(waiting ? 'Prototype: waiting for the QR code from the mobile app window. Finish its steps there.' : 'Prototype: the camera is simulated. This page never turns on your camera.', waiting ? 'qr-sample' : '', 'Use sample details instead'),
      body: `<h1>${head}</h1><p class="hint">${hint}</p>`,
      actions: st === 'found' ? '' : U.btn(t('Cancel'), '', 'data-act="back"'),
    });
  }
  function runScan() {
    const stage = (st) => { if (S.screen !== 'scan') return; S.qr.stage = st; render(); };
    const found = () => { stage('found'); later(() => { applyDetails(S.qr.got); go('recv', { push: false }); }, 1300); };
    const show = (details) => { S.qr.got = details; S.qr.waiting = false; stage('show'); later(found, 1500); };
    later(() => {
      stage('search');
      const code = link.latest();
      if (code) { later(() => show(code.details), 1300); return; }
      if (link.isAlive()) {   // the phone is open: keep looking until it shows its code
        S.qr.waiting = true; render();
        S.qr.poll = every(() => { const c = link.latest(); if (c && S.screen === 'scan' && S.qr.stage === 'search') { clearInterval(S.qr.poll); show(c.details); } }, 400);
        return;
      }

  }

  const RECV = [['wifi', T('Wi-Fi network')], ['loc', T('Location')], ['store', T('Retailer and store')], ['sku', T('SKU ID')], ['rac', T('RAC ID')]];
  const recvRows = () => {
    const d = S.qr.got || sampleDetails(), p = productOf(d.sku);

    return RECV.map(([k, label], i) => {
      const st = i < S.qr.i ? 'ok' : i === S.qr.i ? 'now' : 'wait';
      const status = st === 'ok' ? (k === 'wifi' ? t('Connected') : t('Received')) : st === 'now' && k === 'wifi' ? t('Connecting…') : '';
      return `<div class="row ${st}"><span class="ic">${st === 'ok' ? I.check(14) : ''}</span><div class="tx"><small>${t(label)}</small><b>${esc(val[k])}</b></div><span class="st">${status}</span></div>`;
    }).join('');
  };
  const rRecv = () => U.shell({
    art: A.phone(S.qr.i >= RECV.length ? 'done' : 'qr'), backAttrs: 'data-act="back"', rstyle: 'top:70px',
    body: `<h1>${t('Got your details')}</h1><p class="hint">${t('Your phone sent everything this device needs.')}</p><div class="rcv" id="rcv">${recvRows()}</div>`,
  });
  function runRecv() {
    const step = () => {
      S.qr.i += 1;
      if (S.qr.i >= RECV.length) { render(); later(() => go('qrColl', { push: false }), 900); } else { patch('#rcv', recvRows()); later(step, 650); }
    };
    later(step, 1500);
  }

  /* The one question left: which collection. The phone's SKU suggests one; the user confirms it or picks another. */
  function rQrColl() {
    const d = S.draft, list = racList(), sug = list.find((r) => r.key === S.qr.sug);
    return U.shell({
      art: d.rac === 'gaming' ? A.gaming() : A.device(), backAttrs: 'data-act="back"',
      body: `<h1>${t('Choose a collection')}</h1><p class="hint">${sug ? t('Based on your SKU, we suggest {name}. Confirm it or choose another.', { name: sug.name }) : t('Collections available for {retailer} in {country}.', { retailer: S.cur.retailer, country: i18n.inSentence(L().country) })}</p>
        <div class="list">${list.map((r) => item(r.name, { sel: d.rac === r.key, sub: r.pos, code: r.code, tag: r.key === S.qr.sug ? t('Suggested') : '', v: r.key })).join('')}</div>`,
      actions: primary(t('Confirm'), 'qrcoll-confirm', !!d.rac),
    });
  }

  /* The mobile app is this same page opened with ?view=mobile in a new window, placed beside this one. */
  function openMobile() {
    const u = new URL(location.href);
    u.search = ''; u.hash = '';
    Object.entries({ view: 'mobile', lang: S.lang, theme: S.theme, device: DEVICE_ID }).forEach(([k, v]) => u.searchParams.set(k, v));
    const sc = window.screen, aL = sc.availLeft || 0, aT = sc.availTop || 0, aW = sc.availWidth || 1920, aH = sc.availHeight || 1080;
    const W = 500, H = Math.min(940, Math.max(640, aH - 70));
    let left = (window.screenX != null ? window.screenX : window.screenLeft || 0) + window.outerWidth + 12, overlap = false;
    if (left > aL + aW - W - 8) { left = aL + aW - W - 8; overlap = true; }
    const top = Math.max(aT, Math.min(window.screenY != null ? window.screenY : window.screenTop || 0, aT + aH - H - 8));
    const reuse = !!(mobileWin && !mobileWin.closed);
    const w = reuse ? mobileWin : window.open(u.href, 'rdx-mobile-demo', `popup=yes,width=${W},height=${H},left=${Math.round(left)},top=${Math.round(top)}`);
    if (!w) { toast('Your browser blocked the new window. Allow pop-ups for this page, then try again.'); return; }
    mobileWin = w;
    try { w.focus(); } catch (err) { /* focus can be refused */ }
    toast(reuse ? 'The mobile app is already open. Brought it to the front.' : overlap ? 'Mobile app opened in a new window. Drag it next to this one to see both.' : 'Mobile app opened beside this window. The RDX screen stays open.');
  }

  const SCREENS = { lang: rLang, net: rNet, detect: rDetect, loc: rLoc, locEdit: rLocEdit, ret: rRet, retEdit: rRetEdit, store: rStore, storeEdit: rStoreEdit, rac: rRac, racEdit: rRacEdit, sku: rSku, skuEdit: rSkuEdit, adv: rAdv, cook: rCook, desktop: rDesktop, qr: rQr, scan: rScan, recv: rRecv, qrColl: rQrColl };

  /* ---------- rendering / navigation ---------- */
  function render({ animate = false, keepScroll = false } = {}) {
    const act = document.activeElement;
    const keep = act && act.dataset && act.dataset.f ? { f: act.dataset.f, s: act.selectionStart, e: act.selectionEnd } : null;
    const scroller = keepScroll ? $('.list.scroll', stageEl) : null, scrollTop = scroller ? scroller.scrollTop : 0;

    if (scrollTop) { const again = $('.list.scroll', stageEl); if (again) again.scrollTop = scrollTop; }

  }
  function prepare(s) {

    if (s === 'scan') S.qr = { ...S.qr, stage: 'opening', got: null, waiting: false };
    if (s === 'recv') { S.qr.got = S.qr.got || sampleDetails(); S.qr.i = 0; }

  function go(screen, { push = true, animate = true } = {}) {

    const b = BASE[s];

    const i = CHAIN.indexOf(s);
    return i > 0 ? CHAIN.slice(0, i) : [];
  };
  const JUMP = { '00': 'lang', '01': 'lang', '02': 'net', '03': 'detect', '04': 'loc', '04b': 'locEdit', '05': 'ret', '05b': 'retEdit', '06': 'store', '06b': 'storeEdit', '07': 'rac', '07b': 'racEdit', '08': 'sku', '08b': 'skuEdit', '09': 'adv', '10': 'cook', '12': 'cook', '13': 'desktop', '14': 'qr', '15': 'scan', '16': 'recv', '17': 'qrColl' };

  /* Switch the OOBE language. Variants (English (United Kingdom), Français (Canada), ...) share their language's text. */
  function setLang(tag) {

    link.send('lang', tag);
    render({ keepScroll: true });
  }

  /* ---------- actions ---------- */
  function pick(id, v) {

      case 'l.country': d.country = v; d.state = d.city = ''; break;
      case 'l.state': d.state = v; d.city = ''; break;
      case 'l.city': d.city = v; break;
      case 'a.region': l.region = v; l.country = D.countries(v)[0]; l.state = D.states(v, l.country)[0]; l.city = D.cities(v, l.country, l.state)[0]; resetBelowLoc(); touchDms(); break;
      case 'a.country': l.country = v; l.state = D.states(l.region, v)[0]; l.city = D.cities(l.region, v, l.state)[0]; resetBelowLoc(); touchDms(); break;
      case 'a.state': l.state = v; l.city = D.cities(l.region, l.country, v)[0]; S.cur.store = D.defStore(S.cur.retailer, l); S.cur.storeCustom = ''; touchDms(); break;
      case 'a.city': l.city = v; S.cur.store = D.defStore(S.cur.retailer, l); S.cur.storeCustom = ''; touchDms(); break;

  }

  const ACT = {
    noop() {},
    lang(el) { setLang(el.dataset.v); },
    'lang-next'() { if (!S.rdx) { toast('Standard Windows OOBE would continue here. Click the illustration 5 times to enable RDX.'); return; } go('net'); },
    'qr-setup'() { go('qr'); },
    'qr-ready'() { go('scan'); },
    'qr-sample'() { if (S.screen !== 'scan' || S.qr.stage !== 'search') return; clearInterval(S.qr.poll); S.qr.got = sampleDetails(); S.qr.waiting = false; S.qr.stage = 'show'; render(); later(() => { S.qr.stage = 'found'; render(); later(() => { applyDetails(S.qr.got); go('recv', { push: false }); }, 1300); }, 1500); },
    'qrcoll-confirm'() { const d = S.draft; if (!d.rac) return; S.cur.rac = d.rac; S.cur.racCustom = ''; S.edited.rac = d.rac !== S.qr.sug; go('cook', { push: false }); },

    'tap-continue'() { S.dialog = false; S.rdx = true; render(); toast('RDX mode enabled. Pick a language, then connect to a network.'); },

    auto() { S.net.auto = !S.net.auto; render(); },
    connect() { S.net.busy = true; render(); later(() => { S.net.busy = false; go('detect'); }, 1400); },

    back() { back(); },
    adv() { S.advFrom = S.screen; go('adv'); },
    'adv-back'() { if (S.hist[S.hist.length - 1] === S.advFrom) S.hist.pop(); go(S.advFrom || 'loc', { push: false }); },

  /* ---------- chrome: toolbar, theme, language, speed, fit ---------- */
  const JUMP_OPTS = [['00', '5-tap entry'], ['01', 'Language'], ['02', 'Network'], ['03', 'Detecting'], ['04', 'Location'], ['04b', 'Change location'], ['05', 'Retailer'], ['05b', 'Choose retailer'], ['06', 'Store ID'], ['06b', 'Choose store'], ['07', 'RAC ID'], ['07b', 'Choose collection'], ['08', 'SKU ID'], ['08b', 'Enter SKU ID'], ['09', 'Advanced configuration'], ['10', 'RDX is cooking'], ['12', 'All done'], ['13', 'Windows 11 desktop'], ['14', 'QR code setup'], ['15', 'Scan QR code'], ['16', 'Details received'], ['17', 'Choose collection (QR)']];
  function buildToolbar() {
    $('#ptb').innerHTML = `
      <div class="brand">${I.rdxMark(24)}<b>RDX OOBE</b><span>prototype</span></div>
      <label class="grp"><span class="lbl">Jump to</span><select id="jump">${JUMP_OPTS.map(([v, name]) => `<option value="${v}">${v} · ${name}</option>`).join('')}</select></label>

      <div class="grp"><span class="lbl">Language</span><span class="seg2" id="langSeg">${i18n.TOP.map((l) => `<button data-l="${l.tag}" lang="${l.tag}">${l.short}</button>`).join('')}</span></div>
      <div class="grp"><span class="lbl">Speed</span><span class="seg2" id="speedSeg"><button data-s="1">1×</button><button data-s="4">4×</button></span></div>

  }
  function setTheme(mode) {
